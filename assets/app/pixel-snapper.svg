<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <rect x="6" y="12" width="52" height="40" fill="#111112"/>
  <rect x="10" y="16" width="44" height="32" fill="#7cc4f0"/>
  <!-- sun: left side stays fine, right side is blown up into big pixels -->
  <rect x="14" y="20" width="6" height="6" fill="#f5c243"/>
  <rect x="20" y="22" width="4" height="4" fill="#f5c243"/>
  <!-- smooth-ish mountain on the left -->
  <rect x="10" y="38" width="4" height="10" fill="#2f7d4f"/>
  <rect x="14" y="34" width="4" height="14" fill="#3f9c62"/>
  <rect x="18" y="30" width="4" height="18" fill="#2f7d4f"/>
  <rect x="22" y="34" width="4" height="14" fill="#3f9c62"/>
  <rect x="26" y="40" width="6" height="8" fill="#2f7d4f"/>
  <!-- divider: the snap line -->
  <rect x="32" y="16" width="2" height="32" fill="#111112"/>
  <!-- chunky pixels on the right -->
  <rect x="34" y="16" width="10" height="10" fill="#a9dbf7"/>
  <rect x="44" y="16" width="10" height="10" fill="#f5c243"/>
  <rect x="34" y="26" width="10" height="10" fill="#7cc4f0"/>
  <rect x="44" y="26" width="10" height="10" fill="#a9dbf7"/>
  <rect x="34" y="36" width="10" height="12" fill="#3f9c62"/>
  <rect x="44" y="36" width="10" height="12" fill="#2f7d4f"/>
</svg>
